<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background">
        <header class="rectangle">
            <h1>Emoji Finder</h1>
            <p class="subtitle">Find emoji by keywords</p>
        </header>

        <div class="search-container">
            <input type="text" class="placeholder" placeholder="Placeholder">
        </div>

        <div class="main">
            <div class="card">
                <div class="card-emoji">💯</div>
                <div class="card-title">100</div>
                <div class="card-keywords">Hundred, points, symbol, wow, win, perfect, parties</div>
            </div>        
            <div class="card">
                <div class="card-emoji">🔢</div>
                <div class="card-title">1234</div>
                <div class="card-keywords">input symbol for numbers symbol</div>
            </div>   
            <div class="cardLast"></div>
        </div>
    </div>
</body>
</html>
